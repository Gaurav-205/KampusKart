name: CD - Continuous Deployment

# Manual only: production deploys come from the Vercel (frontend) and Render (backend) Git
# integrations. On push this job failed every time (Render API 400) and would double-deploy
# the backend if its secrets were fixed.
on:
  workflow_dispatch:

jobs:
  deploy-backend:
    name: Trigger Backend Deployment on Render
    runs-on: ubuntu-latest

    steps:
      # --fail-with-body makes API errors (bad key, suspended service, bad payload) fail the job
      # instead of passing silently. Render expects clearCache as "do_not_clear" | "clear".
      - name: Trigger Render Deployment
        run: |
          curl --fail-with-body -sS -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": "do_not_clear"}'
